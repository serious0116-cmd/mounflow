<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOUNFLOW · v9.6</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0b10">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #060608;
            --surface: rgba(18,18,26,0.88);
            --surface-light: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.05);
            --border-focus: rgba(255,255,255,0.12);
            --text-primary: #eceef5;
            --text-secondary: #9a9bb0;
            --text-muted: #55576b;
            --text-label: #6d6f85;
            --shadow: 0 12px 40px rgba(0,0,0,0.5);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --blue: #5b7fff;
            --blue-dim: rgba(91,127,255,0.12);
            --green: #4cd964;
            --green-dim: rgba(76,217,100,0.10);
            --orange: #e8a838;
            --orange-dim: rgba(232,168,56,0.10);
            --purple: #a87cff;
            --purple-dim: rgba(168,124,255,0.10);
            --red: #e86060;
            --red-dim: rgba(232,96,96,0.10);
        }
        html, body { height: 100%; background: var(--bg); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; font-weight: 450; -webkit-font-smoothing: antialiased; padding: 16px; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 2px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--surface); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 18px 22px; box-shadow: var(--shadow); }

        /* ── 標頭 ── */
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .brand { font-size: 22px; font-weight: 800; letter-spacing: 2.5px; color: #fff; opacity: 0.9; text-transform: uppercase; }
        .version { font-size: 8px; font-weight: 700; padding: 3px 12px; border-radius: 30px; background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.04); cursor: pointer; letter-spacing: 0.3px; }

        /* ── 使用者列 ── */
        .user-bar { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
        .user-bar select { background: var(--surface-light); color: var(--text-primary); border: 1px solid var(--border); padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; outline: none; appearance: none; cursor: pointer; }
        .user-bar select:focus { border-color: var(--border-focus); }
        .user-bar .btn-sm { background: var(--surface-light); border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 12px; border-radius: var(--radius-sm); font-size: 9px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
        .user-bar .btn-sm:active { background: rgba(255,255,255,0.06); }
        .user-bar .btn-sm.danger { color: var(--red); }

        /* ── 統計卡片 ── */
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
        .stat { background: rgba(0,0,0,0.25); border-radius: var(--radius-sm); padding: 12px 4px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .stat .label { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-label); }
        .stat .value { font-size: 17px; font-weight: 900; letter-spacing: -0.2px; margin-top: 3px; }
        .stat .value.blue { color: var(--blue); }
        .stat .value.orange { color: var(--orange); }
        .stat .value.purple { color: var(--purple); }

        .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
        .stat-mini { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 8px 4px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .stat-mini .label { font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-label); }
        .stat-mini .value { font-size: 14px; font-weight: 800; margin-top: 1px; }

        /* ── 警示區 ── */
        .alert-banner { background: var(--red-dim); border: 1px solid rgba(232,96,96,0.15); border-radius: var(--radius-sm); padding: 8px 14px; margin-top: 10px; font-size: 11px; font-weight: 600; color: var(--red); display: none; align-items: center; gap: 8px; }
        .alert-banner.show { display: flex; }

        /* ── 圖表 ── */
        .chart-container { margin-top: 14px; background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 6px; }
        canvas#weightChart { width: 100%; height: 120px; display: block; border-radius: 6px; }

        /* ── 部位統計 ── */
        .site-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.03); }
        .site-stats .label { font-size: 8px; color: var(--text-label); text-transform: uppercase; letter-spacing: 0.4px; }
        .site-pill { background: var(--surface-light); padding: 3px 12px; border-radius: 30px; font-size: 10px; color: var(--text-secondary); border: 1px solid var(--border); }
        .site-pill .num { color: var(--text-primary); font-weight: 700; }

        /* ── 區段標籤切換 ── */
        .seg { display: flex; background: rgba(0,0,0,0.30); border-radius: var(--radius-sm); padding: 3px; border: 1px solid var(--border); margin-bottom: 16px; }
        .seg-btn { flex: 1; padding: 8px 0; font-size: 11px; font-weight: 700; color: var(--text-secondary); background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .seg-btn.active { background: rgba(255,255,255,0.06); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        /* ── 表單 ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .field { display: flex; flex-direction: column; gap: 3px; }
        .field label { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-label); }
        .field input, .field select { width: 100%; background: rgba(0,0,0,0.25); color: var(--text-primary); border: 1px solid var(--border); padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; outline: none; transition: border 0.15s; appearance: none; }
        .field input:focus, .field select:focus { border-color: var(--border-focus); }
        .field input::placeholder { color: var(--text-muted); font-weight: 400; }

        .pen-state { background: var(--orange-dim); border: 1px solid rgba(232,168,56,0.12); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; display: none; align-items: center; justify-content: space-between; }
        .pen-state.show { display: flex; }
        .pen-state .label { font-size: 10px; font-weight: 700; color: var(--orange); }
        .pen-state .remain { font-size: 12px; font-weight: 800; color: var(--orange); }

        .hint { font-size: 9px; color: var(--text-muted); margin: 4px 0 10px; }
        .tags { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin: 8px 0; }
        .tag { background: var(--surface-light); border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 4px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; text-align: center; cursor: pointer; transition: all 0.15s; }
        .tag.active { background: var(--blue-dim); border-color: rgba(91,127,255,0.20); color: var(--text-primary); }

        /* ── 按鈕 ── */
        .btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 800; color: #fff; cursor: pointer; transition: all 0.12s ease; display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.2px; }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-primary { background: var(--blue); }
        .btn-success { background: var(--green); color: #0a0a0f; }
        .btn-purple { background: var(--purple); }

        /* ── 篩選 ── */
        .filter-group { margin-bottom: 12px; }
        .filter-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-chip { background: rgba(255,255,255,0.02); color: var(--text-secondary); border: 1px solid var(--border); padding: 4px 14px; border-radius: 30px; font-size: 9.5px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
        .filter-chip.active { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.08); }
        .filter-chip.time-active { background: var(--blue-dim); color: var(--blue); border-color: rgba(91,127,255,0.12); }
        .filter-chip.time-active.active { background: var(--blue); color: #fff; border-color: var(--blue); }

        /* ── 日誌 ── */
        .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 2px; }
        .log-item { background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
        .log-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .log-tag { font-size: 8px; font-weight: 800; padding: 2px 10px; border-radius: 30px; text-transform: uppercase; letter-spacing: 0.3px; }
        .log-tag.dose { background: var(--blue-dim); color: var(--blue); }
        .log-tag.weight { background: var(--green-dim); color: var(--green); }
        .log-tag.side { background: var(--purple-dim); color: var(--purple); }
        .log-time { font-size: 9px; color: var(--text-muted); font-weight: 500; }
        .log-value { font-size: 12px; font-weight: 800; color: var(--text-primary); }
        .log-del { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 2px 6px; transition: color 0.15s; }
        .log-del:active { color: var(--red); }
        .log-empty { color: var(--text-muted); text-align: center; padding: 16px 0; font-size: 11px; }

        /* ── 工具列 ── */
        .toolbar { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .tool-btn { flex: 1; min-width: 50px; background: var(--surface-light); color: var(--text-secondary); border: 1px solid var(--border); padding: 6px 4px; border-radius: var(--radius-sm); font-size: 9px; font-weight: 700; cursor: pointer; text-align: center; transition: background 0.12s; }
        .tool-btn:active { background: rgba(255,255,255,0.04); }
        .tool-btn.danger { color: var(--red); }

        .mt-1 { margin-top: 8px; }
        .mb-1 { margin-bottom: 8px; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .text-muted { color: var(--text-muted); }
        .text-small { font-size: 9px; }
        .panel { display: none; }
        .panel.open { display: block; }
        .inline-flex { display: inline-flex; align-items: center; gap: 4px; }

        /* ── 目標體重區塊 ── */
        .goal-block { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.04); }
        .goal-block .goal-header { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-label); margin-bottom: 3px; }
        .goal-block .goal-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .goal-block .goal-bar .fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; background: linear-gradient(90deg, var(--blue), var(--green)); }
        .goal-block .goal-sub { font-size: 9px; color: var(--text-muted); margin-top: 3px; }
        .goal-block .goal-speed { font-size: 10px; font-weight: 700; margin-top: 5px; color: var(--text-secondary); }
        .goal-block .goal-speed .up { color: var(--green); }
        .goal-block .goal-speed .down { color: var(--red); }
        .goal-block .goal-set { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .goal-block .goal-set input { flex: 1; min-width: 60px; background: rgba(0,0,0,0.20); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 8px; border-radius: 6px; font-size: 10px; outline: none; }
        .goal-block .goal-set input:focus { border-color: var(--border-focus); }
        .goal-block .goal-set .btn-goal { padding: 4px 14px; border: none; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff; cursor: pointer; background: var(--blue); }
        .goal-block .goal-set .hint-text { font-size: 8px; color: var(--text-muted); align-self: center; }

        /* ── 趨勢摘要三欄 ── */
        .trend-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .trend-item { background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 10px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .trend-item .label { font-size: 8px; color: var(--text-label); text-transform: uppercase; letter-spacing: 0.4px; }
        .trend-item .number { font-size: 18px; font-weight: 800; margin-top: 2px; }
        .trend-item .delta { font-size: 10px; font-weight: 700; }
        .trend-item .delta.up { color: var(--green); }
        .trend-item .delta.down { color: var(--red); }
        .trend-item .delta.neutral { color: var(--text-muted); }

        /* ── Toast ── */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(16,16,24,0.92); backdrop-filter: blur(16px); color: #fff; padding: 10px 22px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 8px 32px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.25s ease; pointer-events: none; z-index: 999; max-width: 90%; }
        .toast.show { opacity: 1; }

        /* ── 歡迎畫面 ── */
        .welcome-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center;
        }
        .welcome-overlay .logo { font-size: 42px; font-weight: 800; letter-spacing: 3px; color: #fff; opacity: 0.9; margin-bottom: 12px; }
        .welcome-overlay p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; max-width: 300px; }
        .welcome-overlay input { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm); font-size: 17px; font-weight: 600; width: 100%; max-width: 280px; text-align: center; outline: none; }
        .welcome-overlay input:focus { border-color: var(--border-focus); }
        .welcome-overlay .btn { max-width: 280px; margin-top: 14px; }
        .welcome-overlay .hint { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

        /* ── 初始設定彈窗 ── */
        .setup-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 24px;
        }
        .setup-overlay.show { display: flex; }
        .setup-modal {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 32px 24px 28px; max-width: 360px; width: 100%;
            box-shadow: var(--shadow);
        }
        .setup-modal .modal-title { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 2px; }
        .setup-modal .modal-sub { font-size: 12px; color: var(--text-secondary); text-align: center; margin-bottom: 20px; }
        .setup-modal .field { margin-bottom: 14px; }
        .setup-modal .field label { font-size: 10px; font-weight: 700; color: var(--text-label); text-transform: uppercase; letter-spacing: 0.4px; }
        .setup-modal .field input { width: 100%; background: rgba(0,0,0,0.20); border: 1px solid var(--border); color: #fff; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 18px; font-weight: 700; text-align: center; outline: none; }
        .setup-modal .field input:focus { border-color: var(--border-focus); }
        .setup-modal .field .unit { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 2px; }
        .setup-modal .field .error { font-size: 10px; color: var(--red); margin-top: 3px; display: none; }
        .setup-modal .field .error.show { display: block; }
        .setup-modal .btn { margin-top: 6px; }

        /* ── RWD ── */
        @media (max-width:400px) {
            .grid-2 { grid-template-columns:1fr; }
            .stats { gap:4px; }
            .stat .value { font-size:15px; }
            .card { padding:16px 14px 18px; }
            .stat-row { grid-template-columns: 1fr 1fr; }
            .trend-grid { grid-template-columns: 1fr 1fr; }
            .tags { grid-template-columns: repeat(2,1fr); }
        }
        @media (min-width:600px) { .app { max-width:520px; } }
        @supports (padding:max(0px)) { body { padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom)); } }
    </style>
</head>
<body>

    <!-- 歡迎畫面 -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="logo">MOUNFLOW</div>
        <p>個人用藥記錄器<br>請輸入您的暱稱開始</p>
        <input type="text" id="welcomeName" placeholder="暱稱" maxlength="20" autofocus>
        <button class="btn btn-primary" onclick="createFirstUser()" style="max-width:280px;">開始使用</button>
        <div class="hint">所有資料僅儲存於此瀏覽器</div>
    </div>

    <!-- 初始設定彈窗 -->
    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-modal">
            <div class="modal-title">初始設定</div>
            <div class="modal-sub">請輸入您的起始數據</div>
            <div class="field">
                <label>目前體重</label>
                <input type="number" step="0.1" min="0" inputmode="decimal" id="setupStartWeight" placeholder="請輸入體重" autofocus>
                <div class="unit">公斤 (kg)</div>
                <div class="error" id="setupError">目標體重必須小於目前體重</div>
            </div>
            <div class="field">
                <label>目標體重</label>
                <input type="number" step="0.1" min="0" inputmode="decimal" id="setupTargetWeight" placeholder="請輸入目標體重">
                <div class="unit">公斤 (kg)</div>
            </div>
            <button class="btn btn-primary" onclick="confirmSetup()">確認開始</button>
        </div>
    </div>

    <!-- 修改目標體重彈窗 -->
    <div class="setup-overlay" id="goalOverlay" onclick="if(event.target===this) closeGoalModal()">
        <div class="setup-modal">
            <div class="modal-title" style="font-size:18px;">修改目標體重</div>
            <div class="modal-sub">起始體重自動抓取第一筆紀錄</div>
            <div class="field">
                <label>目標體重</label>
                <input type="number" step="0.1" min="0" inputmode="decimal" id="goalModalInput" placeholder="請輸入目標體重" autofocus>
                <div class="unit">公斤 (kg)</div>
                <div class="error" id="goalModalError">目標須小於起始體重</div>
            </div>
            <button class="btn btn-primary" onclick="confirmGoalModal()">儲存</button>
            <button class="btn" style="margin-top:8px;background:rgba(255,255,255,0.06);color:var(--text-secondary);" onclick="closeGoalModal()">取消</button>
        </div>
    </div>

    <div class="app" id="mainApp">
        <div class="toast" id="toast"></div>

        <!-- ─── 儀表板 ─── -->
        <div class="card">
            <div class="header">
                <span class="brand">MOUNFLOW</span>
                <span class="version" onclick="location.reload()">v9.6</span>
            </div>
            <div class="user-bar">
                <select id="userSelect" onchange="switchUser(this.value)"></select>
                <button class="btn-sm" onclick="addUser()">新增</button>
                <button class="btn-sm danger" onclick="deleteUser()">刪除</button>
            </div>

            <div class="stats">
                <div class="stat"><div class="label">血藥濃度</div><div class="value blue" id="currentLevel">0.00 mg</div></div>
                <div class="stat"><div class="label">針筆剩餘</div><div class="value orange" id="penRemain">-- mg</div></div>
                <div class="stat"><div class="label">下劑倒數</div><div class="value purple" id="nextDoseCountdown">-- 天</div></div>
            </div>

            <div class="alert-banner" id="alertBanner"><span id="alertText"></span></div>

            <div class="stat-row">
                <div class="stat-mini"><div class="label">總注射</div><div class="value" style="color:var(--blue);" id="totalDoses">0</div></div>
                <div class="stat-mini"><div class="label">總花費</div><div class="value" style="color:var(--orange);" id="totalCost">0</div></div>
                <div class="stat-mini"><div class="label">平均劑量</div><div class="value" style="color:var(--purple);" id="avgDose">0 mg</div></div>
            </div>

            <div class="chart-container">
                <canvas id="weightChart"></canvas>
            </div>

            <div class="site-stats">
                <span class="label">注射部位</span>
                <span class="site-pill">左腹 <span class="num" id="siteLeft">0</span></span>
                <span class="site-pill">右腹 <span class="num" id="siteRight">0</span></span>
                <span class="site-pill">大腿 <span class="num" id="siteLeg">0</span></span>
