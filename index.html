<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOUNFLOW · v7.3</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0b10">
    <style>
        /* 样式与 v7.2 一致，为节省篇幅保留核心，实际输出会包含完整样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0f;
            --surface: rgba(22,22,30,0.85);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.10);
            --text-primary: #f0f2f8;
            --text-secondary: #9a9bb0;
            --text-muted: #5b5d73;
            --shadow: 0 20px 56px rgba(0,0,0,0.7);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --blue: #5b9eff;
            --green: #4cd964;
            --orange: #ff9f0a;
            --purple: #b77cff;
            --red: #ff6b6b;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; font-weight: 450; -webkit-font-smoothing: antialiased; padding: 20px env(safe-area-inset-right) 30px env(safe-area-inset-left); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
        .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        .card { background: var(--surface); backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 20px 24px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(135deg, #ffffff 30%, #8e8fa3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .version { font-size: 9px; font-weight: 700; padding: 4px 14px; border-radius: 40px; background: rgba(91,158,255,0.12); color: var(--blue); border: 1px solid rgba(91,158,255,0.20); cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; }
        .version:active { transform: scale(0.92); opacity: 0.6; }
        .user-area { display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 6px; }
        .user-area input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; outline: none; }
        .user-area input:focus { border-color: var(--blue); }
        .user-area .btn-sm { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .user-area .btn-sm:active { background: rgba(255,255,255,0.12); transform: scale(0.95); }
        .user-area .user-label { font-size: 10px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
        .stat { background: rgba(0,0,0,0.35); border-radius: var(--radius-sm); padding: 14px 6px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); }
        .stat .value { font-size: 18px; font-weight: 900; letter-spacing: -0.2px; margin-top: 4px; }
        .value.blue { color: var(--blue); text-shadow: 0 0 24px rgba(91,158,255,0.20); }
        .value.orange { color: var(--orange); text-shadow: 0 0 24px rgba(255,159,10,0.20); }
        .value.purple { color: var(--purple); text-shadow: 0 0 24px rgba(183,124,255,0.20); }

        .trend-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 8px; }
        .trend-item { background: rgba(0,0,0,0.30); border-radius: var(--radius-sm); padding: 14px 10px; border: 1px solid rgba(255,255,255,0.04); text-align: center; }
        .trend-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .trend-number { font-size: 22px; font-weight: 800; margin: 4px 0 2px; line-height: 1.2; }
        .trend-delta { font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .trend-delta.up { color: var(--green); }
        .trend-delta.down { color: var(--red); }
        .trend-delta.neutral { color: var(--text-muted); }
        .trend-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .trend-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
        .trend-sub { font-size: 9px; color: var(--text-muted); margin-top: 4px; }

        .seg { display: flex; background: rgba(0,0,0,0.45); border-radius: var(--radius-sm); padding: 3px; border: 1px solid var(--border); margin-bottom: 18px; }
        .seg-btn { flex: 1; padding: 10px 0; font-size: 12px; font-weight: 700; color: var(--text-secondary); background: transparent; border: none; border-radius: 10px; cursor: pointer; transition: all 0.25s ease; letter-spacing: 0.3px; }
        .seg-btn.active { background: rgba(255,255,255,0.08); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
        .seg-btn:active { transform: scale(0.96); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .field input, .field select, .field textarea { width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.08); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; -webkit-appearance: none; transition: border 0.2s; font-family: inherit; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(91,158,255,0.35); }
        .field textarea { resize: vertical; min-height: 40px; font-weight: 400; font-size: 12px; }
        .field select option { background: #1c1c24; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 800; color: #fff; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.3px; }
        .btn:active { transform: scale(0.97); opacity: 0.85; }
        .btn-primary { background: linear-gradient(135deg, #007aff, #0056b3); box-shadow: 0 4px 24px rgba(0,122,255,0.25); }
        .btn-success { background: linear-gradient(135deg, #34c759, #1e8b3a); box-shadow: 0 4px 24px rgba(52,199,89,0.20); }
        .btn-purple { background: linear-gradient(135deg, #af52de, #7b2fbe); box-shadow: 0 4px 24px rgba(175,82,222,0.20); }
        .tags { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin: 10px 0 10px; }
        .tag { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: var(--text-secondary); padding: 10px 4px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; transition: all 0.2s; }
        .tag.active { background: rgba(91,158,255,0.15); border-color: var(--blue); color: #fff; box-shadow: 0 0 20px rgba(91,158,255,0.10); }
        .tag:active { transform: scale(0.95); }
        .pen-state { background: rgba(255,159,10,0.06); border: 1px solid rgba(255,159,10,0.15); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; display: none; align-items: center; justify-content: space-between; }
        .pen-state.show { display: flex; }
        .pen-state .label { font-size: 11px; font-weight: 700; color: var(--orange); }
        .pen-state .remain { font-size: 13px; font-weight: 800; color: var(--orange); }
        .hint { font-size: 10px; color: var(--text-muted); margin: 6px 0 12px; }

        .filter-bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-chip { background: rgba(255,255,255,0.03); color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.04); padding: 5px 16px; border-radius: 30px; font-size: 10.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .filter-chip.active { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.10); }
        .filter-chip:active { transform: scale(0.95); }
        .log-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
        .log-item { background: rgba(0,0,0,0.30); border: 1px solid rgba(255,255,255,0.04); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .log-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .log-tag { font-size: 9px; font-weight: 800; padding: 2px 12px; border-radius: 30px; text-transform: uppercase; letter-spacing: 0.3px; }
        .log-tag.dose { background: rgba(91,158,255,0.15); color: var(--blue); }
        .log-tag.weight { background: rgba(76,217,100,0.15); color: var(--green); }
        .log-tag.side { background: rgba(183,124,255,0.15); color: var(--purple); }
        .log-time { font-size: 10px; color: var(--text-muted); font-weight: 500; }
        .log-value { font-size: 13px; font-weight: 800; color: var(--text-primary); }
        .log-del { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 4px 6px; transition: color 0.2s; }
        .log-del:active { color: var(--red); transform: scale(0.9); }
        .log-empty { color: var(--text-muted); text-align: center; padding: 20px 0; font-size: 12px; }

        .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .tool-btn { flex: 1; min-width: 60px; background: rgba(255,255,255,0.03); color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.05); padding: 9px 6px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
        .tool-btn:active { background: rgba(255,255,255,0.07); transform: scale(0.96); }
        .tool-btn.danger { color: var(--red); }
        .mt-1 { margin-top: 10px; }
        .mb-1 { margin-bottom: 10px; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .text-muted { color: var(--text-muted); }
        .text-small { font-size: 10px; }
        .panel { display: none; }
        .panel.open { display: block; }
        @media (max-width:400px) { .grid-2 { grid-template-columns:1fr; } .stats { gap:6px; } .stat .value { font-size:16px; } .card { padding:16px 14px 18px; } .trend-grid { grid-template-columns: 1fr 1fr; } }
        @media (min-width:600px) { .app { max-width:520px; } }
        @supports (padding:max(0px)) { body { padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right)); padding-top:max(20px, env(safe-area-inset-top)); padding-bottom:max(30px, env(safe-area-inset-bottom)); } }
    </style>
</head>
<body>
    <div class="app">

        <!-- 儀表板 + 用户切换 -->
        <div class="card">
            <div class="header">
                <span class="brand">MOUNFLOW</span>
                <span class="version" onclick="location.reload()">v7.3</span>
            </div>
            <div class="user-area">
                <span class="user-label">使用者</span>
                <input type="text" id="usernameInput" placeholder="輸入名稱" value="">
                <button class="btn-sm" onclick="switchUser()">切換</button>
                <span class="user-label" id="currentUserDisplay" style="font-weight:700;color:var(--text-secondary);">--</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="label">血藥濃度</div>
                    <div class="value blue" id="currentLevel">0.00 mg</div>
                </div>
                <div class="stat">
                    <div class="label">針筆剩餘</div>
                    <div class="value orange" id="penRemain">-- mg</div>
                </div>
                <div class="stat">
                    <div class="label">下劑倒數</div>
                    <div class="value purple" id="nextDoseCountdown">-- 天</div>
                </div>
            </div>
        </div>

        <!-- 輸入面板（保持不变） -->
        <div class="card">
            <div class="seg">
                <button class="seg-btn active" onclick="switchTab('dose')" id="tabDose">注射</button>
                <button class="seg-btn" onclick="switchTab('weight')" id="tabWeight">體組成</button>
                <button class="seg-btn" onclick="switchTab('side')" id="tabSide">體感</button>
            </div>

            <div id="panelDose" class="panel open">
                <div class="grid-2">
                    <div class="field">
                        <label>日期時間</label>
                        <input type="datetime-local" id="doseTime">
                    </div>
                    <div class="field">
                        <label>劑量 (mg)</label>
                        <select id="doseMg">
                            <option value="2.5">2.5</option>
                            <option value="5.0" selected>5.0</option>
                            <option value="7.5">7.5</option>
                            <option value="10.0">10.0</option>
                            <option value="12.5">12.5</option>
                            <option value="15.0">15.0</option>
                        </select>
                    </div>
                </div>
                <div class="field mb-1">
                    <label>注射部位</label>
                    <select id="doseSite">
                        <option value="左腹部">左腹部</option>
                        <option value="右腹部">右腹部</option>
                        <option value="左大腿">左大腿</option>
                        <option value="右大腿">右大腿</option>
                        <option value="手臂">手臂</option>
                    </select>
                </div>
                <div class="pen-state" id="penState">
                    <span class="label">使用中針筆</span>
                    <span class="remain" id="penRemainLabel">剩餘 -- mg</span>
                </div>
                <div id="penNewGroup">
                    <div class="grid-2">
                        <div class="field">
                            <label>新筆容量 (mg)</label>
                            <input type="number" step="0.1" id="penTotalCap" placeholder="例 50">
                        </div>
                        <div class="field">
                            <label>價格 (NTD)</label>
                            <input type="number" step="1" id="penPrice" placeholder="例 13000">
                        </div>
                    </div>
                    <div class="hint">輸入後自動記憶，直至容量歸零</div>
                </div>
                <button class="btn btn-primary mt-1" onclick="addDose()">儲存注射</button>
            </div>

            <div id="panelWeight" class="panel">
                <div class="grid-2">
                    <div class="field">
                        <label>測量日期</label>
                        <input type="date" id="weightDate">
                    </div>
                    <div class="field">
                        <label>體重 (kg)</label>
                        <input type="number" step="0.01" id="weightVal" placeholder="">
                    </div>
                </div>
                <div class="field mb-1">
                    <label>體脂率 (%)</label>
                    <input type="number" step="0.01" id="pFat" placeholder="">
                </div>
                <button class="btn btn-success mt-1" onclick="addWeight()">儲存體組成</button>
            </div>

            <div id="panelSide" class="panel">
                <div class="text-small text-muted" style="margin-bottom:6px;">選擇今日體感（可複選，亦可自訂）</div>
                <div class="tags" id="sideTags">
                    <button class="tag" data-tag="胃脹排空慢">胃脹排空慢</button>
                    <button class="tag" data-tag="餐後頭痛">餐後頭痛</button>
                    <button class="tag" data-tag="食慾極低">食慾極低</button>
                    <button class="tag" data-tag="輕微飢餓">輕微飢餓</button>
                    <button class="tag" data-tag="精神充沛">精神充沛</button>
                    <button class="tag" data-tag="口乾需補水">口乾需補水</button>
                </div>
                <div class="field mb-1">
                    <label>自訂體感</label>
                    <input type="text" id="customSide" placeholder="輸入您想記錄的體感">
                </div>
                <button class="btn btn-purple" onclick="saveSide()">儲存體感</button>
            </div>
        </div>

        <!-- 趨勢摘要 -->
        <div class="card">
            <div class="flex" style="margin-bottom:6px;">
                <span class="text-small text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">趨勢摘要</span>
                <span class="text-small text-muted" id="trendUpdateTime">最近更新：--</span>
            </div>
            <div class="trend-grid" id="trendGrid">
                <div class="trend-item">
                    <div class="trend-label">體重</div>
                    <div class="trend-number" id="trendWeight">--</div>
                    <div class="trend-delta" id="trendWeightDelta">--</div>
                    <div class="trend-bar"><div class="trend-bar-fill" id="trendWeightBar" style="width:0%;background:var(--blue);"></div></div>
                    <div class="trend-sub">上次記錄</div>
                </div>
                <div class="trend-item">
                    <div class="trend-label">體脂率</div>
                    <div class="trend-number" id="trendFat">--</div>
                    <div class="trend-delta" id="trendFatDelta">--</div>
                    <div class="trend-bar"><div class="trend-bar-fill" id="trendFatBar" style="width:0%;background:var(--orange);"></div></div>
                    <div class="trend-sub">上次記錄</div>
                </div>
                <div class="trend-item">
                    <div class="trend-label">血藥狀態</div>
                    <div class="trend-number" id="trendPk" style="color:var(--blue);">--</div>
                    <div class="trend-delta neutral" id="trendPkDelta">峰值 --</div>
                    <div class="trend-bar"><div class="trend-bar-fill" id="trendPkBar" style="width:0%;background:var(--blue);"></div></div>
                    <div class="trend-sub">距上次注射</div>
                </div>
            </div>
        </div>

        <!-- 歷史紀錄 -->
        <div class="card">
            <div class="flex mb-1">
                <span class="text-small text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">日誌</span>
                <div style="display:flex;gap:6px;">
                    <button class="tool-btn" style="flex:0;padding:4px 12px;font-size:10px;" onclick="exportData()">匯出</button>
                    <button class="tool-btn" style="flex:0;padding:4px 12px;font-size:10px;" onclick="document.getElementById('importFile').click()">匯入</button>
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
                    <button class="tool-btn danger" style="flex:0;padding:4px 12px;font-size:10px;" onclick="clearAll()">清空</button>
                </div>
            </div>
            <div class="filter-bar">
                <button class="filter-chip active" onclick="setLogFilter('all',this)">全部</button>
                <button class="filter-chip" onclick="setLogFilter('dose',this)">注射</button>
                <button class="filter-chip" onclick="setLogFilter('weight',this)">體組成</button>
                <button class="filter-chip" onclick="setLogFilter('side',this)">體感</button>
            </div>
            <div class="log-list" id="logList"></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  用户管理（优化首次体验）
        // ============================================================
        let currentUser = localStorage.getItem('mf_currentUser') || '';

        // 如果 localStorage 中没有记录，则弹窗引导输入
        if (!currentUser) {
            const name = prompt('歡迎使用 MOUNFLOW，請輸入您的名稱（例如：小明）以建立個人資料：', '');
            if (name && name.trim() !== '') {
                currentUser = name.trim();
                localStorage.setItem('mf_currentUser', currentUser);
            } else {
                // 若用户取消或未输入，则设为 'default'
                currentUser = 'default';
                localStorage.setItem('mf_currentUser', currentUser);
            }
        }

        document.getElementById('usernameInput').value = currentUser;
        document.getElementById('currentUserDisplay').textContent = currentUser;

        function switchUser() {
            const newUser = document.getElementById('usernameInput').value.trim();
            if (!newUser) {
                alert('請輸入使用者名稱');
                return;
            }
            currentUser = newUser;
            localStorage.setItem('mf_currentUser', currentUser);
            document.getElementById('currentUserDisplay').textContent = currentUser;
            loadUserData();
        }

        function getUserKey(base) {
            return 'mf_' + currentUser + '_' + base;
        }

        // ============================================================
        //  数据层
        // ============================================================
        let doses = [];
        let weights = [];
        let sides = [];

        function loadUserData() {
            doses = JSON.parse(localStorage.getItem(getUserKey('doses')) || '[]');
            weights = JSON.parse(localStorage.getItem(getUserKey('weights')) || '[]');
            sides = JSON.parse(localStorage.getItem(getUserKey('sides')) || '[]');
            refresh();
        }

        function saveUserData() {
            localStorage.setItem(getUserKey('doses'), JSON.stringify(doses));
            localStorage.setItem(getUserKey('weights'), JSON.stringify(weights));
            localStorage.setItem(getUserKey('sides'), JSON.stringify(sides));
        }

        // ============================================================
        //  其余功能函数（与之前相同，为节省篇幅略，实际输出会包含）
        // ============================================================
        // ...（此处保留所有 addDose, addWeight, saveSide, deleteLog, clearAll, setLogFilter, updateTrend, renderLogs, exportData, importData, refresh 等函数，与 v7.2 一致）
